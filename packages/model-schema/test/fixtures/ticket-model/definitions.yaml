kind: definitions
version: 1.0.0
definitions:
  - {kind: type, name: Note, version: 1.0.0, fields: [{name: body, typeRef: string, required: true}]}
  - kind: type
    name: Ticket
    version: 1.0.0
    fields: [{name: title, typeRef: string, required: true}, {name: priority, typeRef: integer}, {name: active, typeRef: boolean}, {name: owner, typeRef: Owner}, {name: metadata, typeRef: unknown}]
  - {kind: type, name: Owner, version: 1.0.0, fields: [{name: name, typeRef: string, required: true}]}
  - {kind: relation, name: owned-by, version: 1.0.0, from: Ticket, to: Owner, cardinality: many-to-one, directional: true, semantics: {traversal: one-hop, selection: expand, loadOrder: before, cyclePolicy: reject, conflictSeverity: none}}
  - {kind: function, name: TicketSummary, version: 1.0.0, inputs: [{name: ticket, typeRef: Ticket}], output: string, purity: pure, deterministic: true, provider: declarative-fixture}
  - {kind: action, name: ResolveTicket, version: 1.0.0, inputs: [{name: ticket, typeRef: Ticket}], output: boolean, capabilities: [], sideEffects: none, idempotency: idempotent, approval: never, provider: ticket-resolver}
  - {kind: projection, name: summary, version: 1.0.0, targetTokens: 80, include: [title], rules: [{typeRef: Ticket, include: [priority]}]}
  - {kind: projection, name: core, version: 1.0.0, targetTokens: 200, include: [title, priority, active], rules: [{typeRef: group:ticket-types, include: [owner]}], typeGroups: {ticket-types: [Ticket]}}
  - {kind: projection, name: full, version: 1.0.0, targetTokens: 500, include: ["*"]}
  - kind: migration
    name: ticket-v1
    version: 1.0.0
    from: "<1.0.0"
    to: 1.0.0
    steps:
      - renameField: {type: Ticket, from: subject, to: title}
      - mapRelation: {from: assigned-to, to: owned-by}
      - setDefault: {type: Ticket, field: active, value: true}
