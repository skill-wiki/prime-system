      - { name: related, typeRef: unknown, required: false, description: "Edge verb 'related'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown. Corpus: 83/83 units, AST Array=83." }
      - { name: compatible, typeRef: unknown, required: false, description: "Edge verb 'compatible'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown. Corpus: 0/83 units." }
