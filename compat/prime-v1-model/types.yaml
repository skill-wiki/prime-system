# PRIME v1 compatibility model - Type Definitions.
#
# Fields are REVERSE-ENGINEERED from the real corpus, not invented. Evidence per field is in
# its `description`. See docs/lanes/L2-COMPAT-FIELDS.md for the full measurement.
#
# Why typeRef is so often `unknown`: packages/compiler/src/normalizer.ts `convert()` only accepts a
# String/Number/Boolean AST node for a scalar typeRef, and demands a Reference whose path[0] equals
# the type name for a cross-type typeRef. There is NO array or object typeRef in the protocol, so
# every field whose corpus value is an Array/Object/Ident must be declared `unknown`.
# Do NOT 'improve' these to `generic:...`: that passes the loader's builtin() check but fails
# normalizer convert() with UNKNOWN_DECLARED_TYPE_REF.
#
# `required: true` is claimed only when ALL THREE hold: the field is the kind's semantic payload,
# it is present on 100% of corpus instances, and n>=4. Universal metadata (domain/tags/notes/
# related) also reaches 100% on some kinds, but that corpus is single-authored, so 100% there is
# house style, not a protocol obligation -- claiming it would reject the first atom that omits it.
# Kinds with n<=2 (method, collection, principle, tradeoff) therefore require only id and version.
#
# additionalFields: `reject` only for the 9 kinds whose field set was measured exhaustively from
# the corpus. The other 19 kinds have ZERO corpus instances, so closing them would be an invented
# contract, not a measured one. Tighten each one as soon as real atoms of that kind exist.
kind: definitions
version: 1.0.0
definitions:
  - kind: type
    name: fact
    version: 1.0.0
    additionalFields: reject
    fields:
      - { name: id, typeRef: string, required: true, description: "Stable atom identity '@<scope>/<kebab-name>'. spec PRIME-PROTOCOL-v1 1; measured 32/32 atoms." }
      - { name: version, typeRef: string, required: true, description: "SemVer of the atom. spec PRIME-PROTOCOL-v1 1 and 9; measured 32/32 atoms." }
      - { name: name, typeRef: string, required: false, description: "Human-readable name. Measured on collection 2/2; projections.yaml summary layer includes it." }
      - { name: description, typeRef: string, required: false, description: "One-paragraph description. spec PRIME-PROTOCOL-v1 1." }
      - { name: domain, typeRef: unknown, required: false, description: "Owning domain. unknown because the corpus uses a bare Ident (rule/fact/term/...) and an Array (collection)." }
      - { name: tags, typeRef: unknown, required: false, description: "Free-form tag list. Array in corpus, so not expressible as a scalar." }
      - { name: notes, typeRef: unknown, required: false, description: "Author notes. Array in corpus." }
      - { name: composition, typeRef: unknown, required: false, description: "Protocol composition contract with must-include / must-avoid. spec PRIME-PROTOCOL-v1 1 and 3. Object, hence unknown." }
      - { name: related, typeRef: unknown, required: false, description: "Edge verb 'related'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: compatible, typeRef: unknown, required: false, description: "Edge verb 'compatible'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: conflicts, typeRef: unknown, required: false, description: "Edge verb 'conflicts'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: see-also, typeRef: unknown, required: false, description: "Edge verb 'see-also'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: derived-from, typeRef: unknown, required: false, description: "Edge verb 'derived-from'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: requires, typeRef: unknown, required: false, description: "Edge verb 'requires'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: enhances, typeRef: unknown, required: false, description: "Edge verb 'enhances'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: validates-with, typeRef: unknown, required: false, description: "Edge verb 'validates-with'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
      - { name: supplies-to, typeRef: unknown, required: false, description: "Edge verb 'supplies-to'. spec PRIME-PROTOCOL-v1 2; declared in relations.yaml as '*'->'*'. Array of references, hence unknown." }
