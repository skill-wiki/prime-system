      - { name: description, typeRef: string, required: false, description: "One-paragraph description. spec PRIME-PROTOCOL-v1 1. Corpus: 71/83 units, AST String=71." }
      - { name: domain, typeRef: unknown, required: false, description: "Owning domain. unknown because the corpus uses a bare Ident (rule/fact/term/...) and an Array (collection). Corpus: 43/83 units, AST Ident=43." }
      - { name: tags, typeRef: unknown, required: false, description: "Free-form tag list. Array in corpus, so not expressible as a scalar. Corpus: 9/83 units, AST Array=9." }
      - { name: notes, typeRef: unknown, required: false, description: "Author notes. Array in corpus. Corpus: 16/83 units, AST Array=16." }
