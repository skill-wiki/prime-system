# Workspace-wide test runner. Complements the more granular `ci.yml`
# (per-package tests + spec invariants). Once both are in place we will
# likely consolidate into a single workflow.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: bun run test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run workspace tests
        run: bun run test
